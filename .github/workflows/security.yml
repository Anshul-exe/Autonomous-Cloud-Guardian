name: Security Scans

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/anshul-exe/autonomous-cloud-guardian

jobs:
  # JOB1 - SEMGREP -> Static Application Security Testing
  semgrep:
    name: "Semgrep SAST"
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep and generate SARIF
        id: semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/command-injection \
            --sarif \
            --output semgrep.sarif \
            --error \
            --exclude "*.md" \
            --exclude "node_modules" \
            app/
        continue-on-error: true

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

      - name: Fail if vulnerabilities found
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "::error::Semgrep found security vulnerabilities in your code!"
          exit 1

  # JOB2 - Trivy Image Scan
  trivy-image-scan:
    name: "Trivy Image Scan"
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download image artifact
        if: github.event_name != 'schedule'
        id: download
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.event.workflow_run.head_sha }}
          path: /tmp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Load image from artifact
        if: github.event_name != 'schedule' && steps.download.outcome == 'success'
        id: load
        run: |
          docker load -i /tmp/image.tar
          echo "IMAGE_REF=${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV
          echo "loaded=true" >> $GITHUB_OUTPUT

      - name: Pull latest image from GHCR (fallback/scheduled)
        if: github.event_name == 'schedule' || steps.load.outputs.loaded != 'true'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.IMAGE_NAME }}:latest || exit 0
          echo "IMAGE_REF=${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Trivy vulnerability scan
        id: trivy
        if: env.IMAGE_REF != ''
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "library"
          scanners: "vuln"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Fail if critical vulnerabilities found
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy found CRITICAL/HIGH vulnerabilities in the container image!"
          exit 1
