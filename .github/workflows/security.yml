name: Security checks after ci acceptance

on:
  workflow_run:
    workflows: ["CI to start with"]
    types: [completed]

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/anshul-exe/autonomous-cloud-guardian

jobs:
  # JOB1 - SEMGREP -> Static Application Security Testing
  semgrep:
    name: "Semgrep SAST"
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/javascript
            p/nodejs
            p/owasp-top-ten
            p/command-injection
          # generateSarif: "1"
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          # (Static Analysis Results Interchange Format - JSON output, structured)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_ENABLE_VERSION_CHECK: "false"

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() # upload even if scan found issues
        with:
          sarif_file: semgrep.sarif

  # JOB2 - Trivy se Image Scan
  trivy-image-scan:
    name: "Trivy Image Scan"
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download image artifact (push/PR runs)
        if: github.event_name != 'schedule'
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.event.workflow_run.head_sha }}
          path: /tmp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Load image from artifact (push/PR runs)
        if: github.event_name != 'schedule'
        run: |
          if [ -f /tmp/image.tar ]; then
            docker load -i /tmp/image.tar
            echo "IMAGE_REF=${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV
          fi

      - name: Pull latest image from GHCR (scheduled nightly runs)
        if: github.event_name == 'schedule'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.IMAGE_NAME }}:latest
          echo "IMAGE_REF=${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Trivy scan — security gate
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1" # high/critical bug milne pe exit
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true # vulnerabiltiy=true & patch=false(not out yet) = ignore
          vuln-type: "os,library"

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() # bug found mtlb = scan failed, still report uploaded
        with:
          sarif_file: trivy-results.sarif

      - name: Upload raw Trivy report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30
